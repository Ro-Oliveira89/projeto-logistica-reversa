  Q05_coleta_antes_solicitacao: {frac_min: 0.02, frac_max: 0.04, base: coletas}
  Q06_embarque_antes_coleta: {minimo: 3, maximo: 5}
  Q07_entrega_antes_embarque: {minimo: 5, maximo: 10}
  Q08_entrega_antes_solicitacao: {minimo: 2, maximo: 4}
  Q09_entrega_sem_embarque: {frac_min: 0.03, frac_max: 0.05, base: entregas}
  Q10_disp_depois_solicitacao: {minimo: 4, maximo: 8}
  Q11_espaco_em_uf: {minimo: 20, maximo: 40}
  Q13_cidade_sem_prazo: {minimo: 3, maximo: 5}
  Q15_qtd_vazia: {minimo: 10, maximo: 15}
  Q16_qtd_zero: {frac_min: 0.15, frac_max: 0.25, base: oms}
  Q17_dacte_vazio: {minimo: 20, maximo: 30}
  Q18_origens_fora_da_base: {minimo: 3, maximo: 5}
  excecoes_manuais:
    sigla: {minimo: 2, maximo: 3}
