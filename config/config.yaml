# Parâmetros do gerador de dados sintéticos.
# Todos os valores são fictícios: propostas aprovadas na especificação do projeto.
semente: 42

periodo:
  inicio: "2026-01-05"
  fim: "2026-09-17"

volume:
  total_oms: 2000
  tolerancia: 200

numeracao:
  primeira_om: 9000001

estrutura:
  quantidade_polos: 14
  quantidade_ufs: 12
  prefixo_polo: "POLO_"
  prefixo_representante: "REP_"
  modais: ["MODAL_A", "MODAL_B", "MODAL_C"]
  prefixo_franquia: "FRANQUIA "

prazos:
  coleta_padrao_dias_uteis: 2
  margem_embarque_dias: 2
  coleta_especial:
    quantidade_cidades: 4
    dias_minimo: 3
    dias_maximo: 5
  leadtime:
    dias_minimo: 2
    dias_maximo: 12

# Falhas a injetar para a aba QUALIDADE. "minimo/maximo" são quantidades de linhas;
# "frac_min/frac_max" são frações da base indicada em "base".
falhas:
